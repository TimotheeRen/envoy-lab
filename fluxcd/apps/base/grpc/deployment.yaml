apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc
  template:
    metadata:
      labels:
        app: grpc
    spec:
      containers:
        - name: grpc
          image: timotheeren/grpc:latest
          ports:
            - containerPort: 50051
